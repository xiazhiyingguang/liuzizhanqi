const grid=document.querySelector('#grid'),search=document.querySelector('#search'),system=document.querySelector('#system'),dialog=document.querySelector('#detail');
function draw(){const q=search.value.trim().toLowerCase();const shown=weapons.filter(w=>(!system.value||w.system===system.value)&&(!q||(w.heroName+w.weaponName+w.id).toLowerCase().includes(q)));grid.replaceChildren(...shown.map(w=>{const card=document.createElement('article');card.innerHTML='<button type="button" aria-label="查看'+w.heroName+'的'+w.weaponName+'"><img src="'+w.file+'" alt="'+w.heroName+' · '+w.weaponName+'" decoding="async"></button><footer><div><h2>'+w.heroName+' · '+w.weaponName+'</h2><small>'+w.system+'</small></div><a href="'+w.file+'" download>PNG</a></footer>';card.querySelector('button').addEventListener('click',()=>{document.querySelector('#title').textContent=w.heroName+' · '+w.weaponName;document.querySelector('#full').src=w.file;document.querySelector('#full').alt=w.heroName+' · '+w.weaponName;document.querySelector('#download').href=w.file;dialog.showModal()});return card}));document.querySelector('#count').textContent=shown.length+' / '+weapons.length+' 件';document.querySelector('#empty').hidden=shown.length>0}search.addEventListener('input',draw);system.addEventListener('change',draw);document.querySelector('#close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});draw();
