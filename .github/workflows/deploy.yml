name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

# GITHUB_TOKEN 权限：GitHub Pages 官方 Actions 流程所需
# administration: write 用于首次自动启用 Pages（configure-pages enablement）
permissions:
    contents: read
    pages: write
    id-token: write
    administration: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Setup Pages
              uses: actions/configure-pages@v5
              with:
                  enablement: true

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
